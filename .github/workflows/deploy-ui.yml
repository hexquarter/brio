name: Deploy UI to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mini-app/package-lock.json

      - name: Install dependencies
        working-directory: mini-app
        run: npm ci

      - name: Build
        working-directory: mini-app
        env:
          VITE_BREEZ_API_KEY: ${{ secrets.VITE_BREEZ_API_KEY }}
          VITE_BACKEND_ENDPOINT: ${{ secrets.VITE_BACKEND_ENDPOINT }}
          VITE_TELEGRAM_BOT_USERNAME: ${{ secrets.VITE_TELEGRAM_BOT_USERNAME }}
          # Optional, add as repository secrets if you need to override defaults:
          # VITE_NOSTR_RELAYS: ${{ secrets.VITE_NOSTR_RELAYS }}
          # VITE_NOSTR_SERVICE_PUBKEY: ${{ secrets.VITE_NOSTR_SERVICE_PUBKEY }}
          # VITE_WEBAUTHN_RP_ID: ${{ secrets.VITE_WEBAUTHN_RP_ID }}
          # VITE_WEBAUTHN_RP_NAME: ${{ secrets.VITE_WEBAUTHN_RP_NAME }}
        run: |
          repo_name="${GITHUB_REPOSITORY##*/}"
          if [[ "$repo_name" == *.github.io ]]; then
            base_path="/"
          else
            base_path="/${repo_name}/"
          fi
          npm run build -- --base="$base_path"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: mini-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
