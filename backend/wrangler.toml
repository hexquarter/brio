name = "brio-backend"
main = "index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
NOSTR_RELAYS = "wss://relay.primal.net,wss://relay.snort.social,wss://relay.nostr.net,wss://nostr.bitcoiner.social,wss://relay.nostrcheck.me"
ENVIRONMENT = "production"
BOT_USERNAME = "brio_dev_bot"

# Create the namespace with:
#   wrangler kv namespace create BRIO_KV
# then paste the returned id below.
[[kv_namespaces]]
binding = "BRIO_KV"
id = "68b15f604978417a9dcf537246385bd8"

[observability]
enabled = true
